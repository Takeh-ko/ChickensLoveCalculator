<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="welcomeHeader">
        <h1>Welcome to the Chicken's Favorite Love Calculator!</h1>
    </div>
    <img src="images/heartLoveChicken.png" alt="Cute Chicken holding a heart" id="heartLoveChicken"/>
    <div id="nameInput">
        <p id="compatibilityParagraph"></p>
        <p id="commentParagraph"></p>
        <p id="typeInParagraph">Type in both of your names and let's calculate!</p>
        <div id="inputFields">
            <input type="text" id="nameOne" placeholder="Your name">
            <input type="text" id="nameTwo" placeholder="Partner's name">
        </div>
        <button onClick="calculate()" id="calculateButton">Calculate!</button>
    </div>

    <div id="secret">
        <a href="secret.html">You found me!</p>
    </div>
    

    
    <script src="script.js"></script>
</body>
</html>
